[package]
name = "pincel"
version = "0.1.0"
description = "Editor de imagens simples, inspirado no Paint"
edition = "2021"

[lib]
name = "pincel_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-window-state = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "gif", "webp", "tiff", "ico"] }
# Remover fundo: modelo U²-Netp (Apache-2.0) rodando localmente, em Rust puro
# (sem bibliotecas nativas, funciona em Mac Intel, Apple Silicon e Windows).
tract-onnx = "0.23"

# Binário de release o menor possível.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

# Decodificar/codificar imagens sem otimização é muito lento até no modo de teste.
[profile.dev.package.image]
opt-level = 3
[profile.dev.package.png]
opt-level = 3
[profile.dev.package.zune-jpeg]
opt-level = 3
[profile.dev.package.gif]
opt-level = 3
[profile.dev.package.color_quant]
opt-level = 3
[profile.dev.package.fdeflate]
opt-level = 3
[profile.dev.package.miniz_oxide]
opt-level = 3
[profile.dev.package.tract-core]
opt-level = 3
[profile.dev.package.tract-linalg]
opt-level = 3
[profile.dev.package.tract-data]
opt-level = 3
[profile.dev.package.tract-hir]
opt-level = 3
[profile.dev.package.tract-onnx]
opt-level = 3
[profile.dev.package.tract-onnx-opl]
opt-level = 3
[profile.dev.package.tract-nnef]
opt-level = 3

# A inferência e os codecs de imagem precisam de velocidade, não de tamanho.
[profile.release.package.tract-core]
opt-level = 3
[profile.release.package.tract-linalg]
opt-level = 3
[profile.release.package.tract-data]
opt-level = 3
[profile.release.package.tract-hir]
opt-level = 3
[profile.release.package.tract-onnx]
opt-level = 3
[profile.release.package.tract-onnx-opl]
opt-level = 3
[profile.release.package.tract-nnef]
opt-level = 3
[profile.release.package.image]
opt-level = 3
