<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pincel</title>
  </head>
  <body>
    <div id="app">
      <header id="titlebar" data-tauri-drag-region>
        <nav id="menubar" aria-label="Menu"></nav>
        <div class="title-actions">
          <button id="tb-save" class="title-button" title="Salvar" aria-label="Salvar">
            <svg viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 3h9L17 6.5v9a1.5 1.5 0 0 1-1.5 1.5h-11A1.5 1.5 0 0 1 3 15.5v-11A1.5 1.5 0 0 1 4.5 3z"/><path d="M6.5 3v3.5h6V3"/><path d="M6 17v-5.5h8V17"/></svg>
          </button>
          <span class="title-sep"></span>
          <button id="tb-undo" class="title-button" title="Desfazer" aria-label="Desfazer">
            <svg viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M8 4 4 8l4 4"/><path d="M4 8h8a4 4 0 0 1 0 8H9"/></svg>
          </button>
          <button id="tb-redo" class="title-button" title="Refazer" aria-label="Refazer">
            <svg viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="m12 4 4 4-4 4"/><path d="M16 8H8a4 4 0 0 0 0 8h3"/></svg>
          </button>
        </div>
        <div id="doc-title" data-tauri-drag-region></div>
        <div class="drag-fill" data-tauri-drag-region></div>
      </header>
      <div id="ribbon" role="toolbar" aria-label="Ferramentas"></div>
      <div id="contextbar" hidden></div>
      <div id="workspace">
        <div id="canvas-area">
          <div id="ruler-corner"></div>
          <canvas id="ruler-top" class="ruler"></canvas>
          <canvas id="ruler-left" class="ruler"></canvas>
          <main id="viewport"></main>
        </div>
        <aside id="layers-panel" aria-label="Camadas" hidden></aside>
      </div>
      <footer id="statusbar"></footer>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
